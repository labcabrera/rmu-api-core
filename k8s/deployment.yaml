apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmu-api-core
  labels:
    app: rmu-api-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmu-api-core
  template:
    metadata:
      labels:
        app: rmu-api-core
    spec:
      containers:
      - name: rmu-api-core
        image: labcabrera/rmu-api-core:latest
        ports:
        - containerPort: 3001
        env:
        - name: RMU_MONGO_CORE_URI
          valueFrom:
            configMapKeyRef:
              name: rmu-shared-configmap
              key: RMU_MONGO_CORE_URI
